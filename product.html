
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f7f4ee">
    <title>Product Details | NOIRÉ</title>

    <link rel="stylesheet" href="style.css">
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
    <style>
        .product-page {
            max-width: 1200px;
            margin: 0 auto;
            padding: 48px 6%;
        }

        .product-breadcrumb {
            margin-bottom: 32px;
            color: #777;
            font-size: 13px;
        }

        .product-layout {
            display: grid;
            grid-template-columns: 1.1fr 0.9fr;
            gap: 64px;
            align-items: start;
        }

       
/* NOIRÉ premium product detail viewer */
.product-image-panel {
    position: relative;
    min-width: 0;
    min-height: 480px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;

    background: radial-gradient(
        ellipse,
        #343027 0%,
        #191817 55%,
        #101010 100%
    );

    border: 1px solid #39352d;
    border-radius: 18px;
}

#detailModel {
    display: block;
    width: 100%;
    height: 480px;

    background: transparent;
    --poster-color: transparent;

    --progress-bar-color: #c8a96b;
    --progress-bar-height: 3px;
}

#detailImage {
    width: 100%;
    height: 480px;
    padding: 24px;
    object-fit: contain;
}

#detailImage[hidden],
#detailModel[hidden] {
    display: none;
}

@media (max-width: 760px) {
    .product-image-panel {
        min-height: 340px;
    }

    #detailModel,
    #detailImage {
        height: 340px;
    }
}


#detailImage[hidden] {
    display: none;
}

        .product-eyebrow {
            font-size: 11px;
            letter-spacing: 3px;
            color: #987a4b;
            text-transform: uppercase;
        }

        .product-information h1 {
            font-size: clamp(30px, 4vw, 48px);
            margin: 16px 0;
        }

        .product-detail-price {
            font-size: 24px;
            margin: 20px 0;
        }

        .product-description {
            color: #666;
            line-height: 1.9;
            margin: 24px 0;
        }

        .product-back-link {
            display: inline-block;
            margin-top: 24px;
            color: var(--text);
            text-decoration: none;
        }

        .product-message {
            color: #777;
            line-height: 1.7;
        }

        @media (max-width: 760px) {
            .product-page {
                padding: 28px 5%;
            }

            .product-layout {
                grid-template-columns: 1fr;
                gap: 24px;
            }

            .product-image-panel,
            .product-image-panel img {
                min-height: 300px;
                height: 340px;
            }

            .product-information {
                padding-top: 0;
            }
        }
    </style>
</head>

<body>
    <header class="navbar">
        <a href="index.html" class="logo">NOIRÉ<span>.</span></a>

       
<nav class="nav-links">
    <a href="index.html#home">Home</a>
    <a href="index.html#shop">Shop</a>
    <a href="index.html#categories">Collections</a>
    <a href="index.html#about">Our Story</a>

    <button type="button" id="themeToggle" class="theme-toggle"
            aria-label="Switch to light mode"
            title="Switch theme">
        <span id="themeIcon" aria-hidden="true">☀</span>
    </button>
</nav>
</header>


    <main class="product-page">
        <p class="product-breadcrumb">
            <a href="index.html#shop">Shop</a> / Product Details
        </p>

        <section class="product-layout">
            
<div class="product-image-panel">
    <img
        id="detailImage"
        src=""
        alt="NOIRÉ fashion product"
    >

    <model-viewer
        id="detailModel"
        src=""
        alt="Interactive 3D model of the selected NOIRÉ product"
        camera-controls
        auto-rotate
        shadow-intensity="1.5"
        environment-image="legacy"
        exposure="0.75"        hidden
    ></model-viewer>
</div>


            <div class="product-information">
                <p class="product-eyebrow">NOIRÉ COLLECTION</p>

                <h1 id="detailName">Discovering your product...</h1>

                <p class="product-detail-price" id="detailPrice"></p>

                <p class="product-description" id="detailDescription">
                    Please wait while we load the product details.
                </p>

                <p class="product-message" id="detailMessage" aria-live="polite"></p>

                <a href="index.html#shop" class="product-back-link">
                    ← BACK TO COLLECTION
                </a>
            </div>
        </section>
    </main>
    

<script src="products.js"></script>
<script>

    
const products = window.noireProducts || [];

    const productId = Number(
        new URLSearchParams(window.location.search).get("id")
    );

    const product = products.find(item => item.id === productId);

    const money = new Intl.NumberFormat("en-NG", {
        style: "currency",
        currency: "NGN",
        maximumFractionDigits: 0
    });

   
if (product) {
    const detailImage = document.getElementById("detailImage");
    const detailModel = document.getElementById("detailModel");

    detailImage.alt = product.name;

    if (product.model) {
        const modelPath = product.model.startsWith("assets/")
            ? product.model
            : `assets/models/${product.model}`;

        detailModel.src = modelPath;
        detailModel.alt = `Interactive 3D view of ${product.name}`;
        detailModel.hidden = false;
        detailImage.hidden = true;
    } else {
        detailImage.src = product.image;
        detailImage.hidden = false;
        detailModel.hidden = true;
        detailModel.removeAttribute("src");
    }

        document.getElementById("detailName").textContent = product.name;
        document.getElementById("detailPrice").textContent =
            money.format(product.price);

        document.getElementById("detailDescription").textContent =
            `${product.name} from our ${product.category} collection. Discover premium style with NOIRÉ.`;

        document.getElementById("detailMessage").textContent =
            product.tag ? product.tag : "";
    } else {
        document.getElementById("detailName").textContent =
            "Product not found";
        document.getElementById("detailDescription").textContent =
            "Please return to our collection and select a product.";
        document.getElementById("detailImage").hidden = true;
    }

/* NOIRÉ shared light/dark theme */
(function () {
    const themeToggle = document.getElementById("themeToggle");
    const themeIcon = document.getElementById("themeIcon");

    function applyProductTheme(theme) {
        const selectedTheme = theme === "light" ? "light" : "dark";

        document.documentElement.setAttribute("data-theme", selectedTheme);

        if (themeIcon) {
            themeIcon.textContent = selectedTheme === "dark" ? "☀" : "☾";
        }

        if (themeToggle) {
            themeToggle.setAttribute(
                "aria-label",
                selectedTheme === "dark"
                    ? "Switch to light mode"
                    : "Switch to dark mode"
            );
        }
    }

    applyProductTheme(localStorage.getItem("noire-theme") || "dark");

    themeToggle?.addEventListener("click", function () {
        const currentTheme =
            document.documentElement.getAttribute("data-theme") || "dark";

        const newTheme = currentTheme === "dark" ? "light" : "dark";

        localStorage.setItem("noire-theme", newTheme);
        applyProductTheme(newTheme);
    });
})();


</script>
</body>
</html>
